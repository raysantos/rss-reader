name: Fetch feeds

on:
  schedule:
    - cron: '17 * * * *'   # hourly
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: fetch-feeds
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch, encrypt, save
        env:
          FEEDS: ${{ secrets.FEEDS }}
          PASSCODE: ${{ secrets.PASSCODE }}
        run: node scripts/fetch.mjs
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/data.enc.json
          git diff --cached --quiet || git commit -m "Update feeds" && git push
