<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Feeds</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23e8743b'/%3E%3Ccircle cx='7' cy='17' r='2' fill='white'/%3E%3Cpath d='M5 11a8 8 0 0 1 8 8M5 5a14 14 0 0 1 14 14' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f6f3; --surface: #ffffff; --text: #1d1c1a; --muted: #6f6b64;
    --line: #e6e3dd; --accent: #d9602b; --accent-soft: #fbe9df; --star: #e0a100;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #141413; --surface: #1d1c1b; --text: #ecebe8; --muted: #9b968e;
    --line: #2d2b29; --accent: #f08a5d; --accent-soft: #3a2418; --star: #f5c542;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --surface: #1d1c1b; --text: #ecebe8; --muted: #9b968e;
      --line: #2d2b29; --accent: #f08a5d; --accent-soft: #3a2418; --star: #f5c542;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* header */
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 12px; height: 60px; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: -.01em; margin-right: auto; }
  .icon-btn { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--surface); color: var(--text); }
  .icon-btn svg { width: 20px; height: 20px; }
  .theme .moon { display: none; }
  :root[data-theme="dark"] .theme .sun { display: none; }
  :root[data-theme="dark"] .theme .moon { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme .sun { display: none; }
    :root:not([data-theme="light"]) .theme .moon { display: block; }
  }
  .tabs { display: flex; gap: 4px; padding-bottom: 10px; }
  .tab { padding: 6px 12px; border-radius: 999px; font-size: 14px; color: var(--muted); }
  .tab[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tab .n { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }

  /* list */
  main { padding: 8px 0 64px; }
  .item { display: flex; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .item a { flex: 1; min-width: 0; color: inherit; text-decoration: none; }
  .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .item.read .dot { visibility: hidden; }
  .title { font-weight: 600; font-size: 17px; line-height: 1.35; margin: 2px 0 4px; }
  .item.read .title { color: var(--muted); font-weight: 500; }
  .sum { color: var(--muted); font-size: 14.5px; margin: 0;
         display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item a:hover .title { color: var(--accent); }
  .star { align-self: flex-start; color: var(--muted); }
  .star[aria-pressed="true"] { color: var(--star); }
  .star[aria-pressed="true"] svg { fill: currentColor; }
  .empty { text-align: center; color: var(--muted); padding: 64px 0; }
  .foot { font-size: 13px; color: var(--muted); padding-top: 24px; }
  .foot details { margin-top: 8px; }

  /* lock */
  .lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .lock form { width: 100%; max-width: 320px; display: grid; gap: 12px; text-align: center; }
  .lock input[type=password] {
    font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); text-align: center; letter-spacing: .1em;
  }
  .lock input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lock .go { padding: 12px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; }
  .lock label { font-size: 14px; color: var(--muted); display: flex; gap: 8px; justify-content: center; align-items: center; }
  .err { color: var(--accent); font-size: 14px; min-height: 1.5em; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
</svg>

<section class="lock" id="lock">
  <form id="unlock" autocomplete="off">
    <svg class="icon-btn" style="margin:0 auto;color:var(--accent)"><use href="#i-lock"/></svg>
    <input type="password" id="pass" placeholder="Passcode" aria-label="Passcode" autofocus>
    <button class="go" type="submit">Open</button>
    <label><input type="checkbox" id="remember"> Remember on this device</label>
    <p class="err" id="err" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="bar">
        <div class="brand">Feeds</div>
        <button class="icon-btn" id="markAll" title="Mark all as read" aria-label="Mark all as read"><svg><use href="#i-check"/></svg></button>
        <button class="icon-btn" id="lockBtn" title="Lock" aria-label="Lock"><svg><use href="#i-lock"/></svg></button>
        <button class="icon-btn theme" id="theme" aria-label="Toggle light or dark mode">
          <svg class="sun"><use href="#i-sun"/></svg><svg class="moon"><use href="#i-moon"/></svg>
        </button>
      </div>
      <nav class="tabs" aria-label="Filter">
        <button class="tab" data-view="unread" aria-pressed="true">Unread<span class="n" id="nUnread"></span></button>
        <button class="tab" data-view="all" aria-pressed="false">All</button>
        <button class="tab" data-view="starred" aria-pressed="false">Starred<span class="n" id="nStarred"></span></button>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div id="list"></div>
    <div class="foot" id="foot"></div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
